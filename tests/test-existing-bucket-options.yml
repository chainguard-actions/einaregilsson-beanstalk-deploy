name: Test existing bucket and version options with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create deployment package
        run: |
          mkdir -p /tmp/pkg
          echo "hello" > /tmp/pkg/index.html
          cd /tmp/pkg && (zip -q /tmp/deploy.zip index.html 2>/dev/null || tar -cf /tmp/deploy.zip index.html)
          ls -l /tmp/deploy.zip
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          aws_access_key: AKIAINVALIDEXAMPLE00
          aws_secret_key: invalidSecretKeyForTestingOnly0000000000
          region: us-east-1
          application_name: nonexistent-test-app
          environment_name: nonexistent-test-env
          version_label: test-version-bucket
          deployment_package: /tmp/deploy.zip
          existing_bucket_name: nonexistent-test-bucket-actionchain
          use_existing_version_if_available: "true"
          wait_for_deployment: "true"
          wait_for_environment_recovery: "5"
      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid AWS credentials"
            exit 1
          fi
          echo "PASS"
