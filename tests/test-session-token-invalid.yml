name: Test temporary credentials with session token fail gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          aws_access_key: ASIAINVALIDEXAMPLE00
          aws_secret_key: invalidSecretKeyForTestingOnly0000000000
          aws_session_token: invalidSessionTokenForTestingOnly
          region: us-east-1
          application_name: nonexistent-test-app
          environment_name: nonexistent-test-env
          version_label: test-version-session
          wait_for_deployment: "false"
      - name: Assert action failed with invalid temporary credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid AWS session credentials"
            exit 1
          fi
          echo "PASS"
