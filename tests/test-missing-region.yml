name: Test missing region fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws_access_key: AKIAEXAMPLEKEY
          aws_secret_key: examplesecretkey
          region: ""
          application_name: test-app
          environment_name: test-env
          version_label: v1
      - name: Assert action failed due to missing region
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when region is empty"
            exit 1
          fi
          echo "PASS"
