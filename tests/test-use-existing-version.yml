name: Test use existing version and recovery wait with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          aws_access_key: AKIAFAKEFAKEFAKEFAKE
          aws_secret_key: fakesecretfakesecretfakesecretfakesecre
          region: eu-west-1
          application_name: actionchain-nonexistent-app
          environment_name: actionchain-nonexistent-env
          version_label: test-existing-v1
          use_existing_version_if_available: "true"
          wait_for_deployment: "true"
          wait_for_environment_recovery: "5"
          max_backoff_retries: "0"
      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid AWS credentials"
            exit 1
          fi
          echo "PASS"
