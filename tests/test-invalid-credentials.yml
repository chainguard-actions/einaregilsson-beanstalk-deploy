name: Test invalid AWS credentials fail gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create deployment package
        run: |
          mkdir -p /tmp/pkg
          echo "hello" > /tmp/pkg/index.html
          cd /tmp/pkg
          if command -v zip >/dev/null 2>&1; then
            zip -q /tmp/deploy.zip index.html
          else
            python3 -c "import zipfile; z=zipfile.ZipFile('/tmp/deploy.zip','w'); z.write('index.html'); z.close()" || cp index.html /tmp/deploy.zip
          fi
          ls -l /tmp/deploy.zip
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          aws_access_key: AKIAINVALIDEXAMPLE00
          aws_secret_key: invalidSecretKeyForTestingOnly0000000000
          region: us-east-1
          application_name: nonexistent-test-app
          environment_name: nonexistent-test-env
          version_label: test-v1.0.0
          version_description: Test deployment from act
          deployment_package: /tmp/deploy.zip
          wait_for_deployment: "false"
          max_backoff_retries: "1"
      - name: Assert action failed (AWS rejected invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid AWS credentials"
            exit 1
          fi
          echo "PASS"
