name: Test session token, existing bucket and version description with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a deployment package
        run: |
          mkdir -p /tmp/pkg
          echo "hello" > /tmp/pkg/index.html
          cd /tmp/pkg
          if command -v zip >/dev/null 2>&1; then
            zip -q "$GITHUB_WORKSPACE/deploy.zip" index.html
          else
            python3 -c "import zipfile; z=zipfile.ZipFile('$GITHUB_WORKSPACE/deploy.zip','w'); z.write('index.html'); z.close()" || cp index.html "$GITHUB_WORKSPACE/deploy.zip"
          fi
          ls -l "$GITHUB_WORKSPACE/deploy.zip"
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          aws_access_key: ASIAFAKEFAKEFAKEFAKE
          aws_secret_key: fakesecretfakesecretfakesecretfakesecre
          aws_session_token: fakesessiontokenfakesessiontokenfakesessiontoken
          region: us-east-1
          application_name: actionchain-nonexistent-app
          environment_name: actionchain-nonexistent-env
          version_label: test-v1
          version_description: "Test version description from actionchain"
          deployment_package: deploy.zip
          existing_bucket_name: actionchain-nonexistent-bucket
          wait_for_deployment: "false"
          max_backoff_retries: "0"
      - name: Assert action failed with invalid temporary credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid AWS temporary credentials"
            exit 1
          fi
          echo "PASS"
